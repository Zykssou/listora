<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Listora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; text-align: center; }
        h2 { margin-bottom: 24px; font-size: 1.3rem; }
        input { width: 100%; background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 16px; }
        input:focus { border-color: #f97316; }
        .btn { width: 100%; background: #f97316; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #ea6a0a; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔒 Admin Access</h2>
    <form method="GET" action="/admin">
        <input type="password" name="pwd" placeholder="Password" autofocus>
        <button class="btn" type="submit">Enter</button>
    </form>
</div>
</body>
</html>
